[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mag7-tactical-allocation"
version = "0.2.0"
description = "Research scaffold for Mag7 and tactical leveraged Nasdaq exposure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["pandas>=2.2,<3", "numpy>=1.26,<3", "yfinance>=0.2.54,<2", "exchange-calendars>=4.5,<5", "tzdata>=2024.1"]

[tool.setuptools.packages.find]
where = ["src"]
